# Black in Denver — same worker code, different city.
#
# Isolation is deliberate: Atlantium's database holds users, sessions,
# memberships and billing for a live product. Denver gets its own Neon project
# so an experimental second market can never take that down. The CODE stays
# shared — MARKET selects the geography in src/lib/markets.ts, and every
# downstream stage (extraction, salary estimates, logos, snapshots) is
# market-agnostic and improves both cities at once.
name = "blackindenver-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain added once DNS for blackindenver.org points at Cloudflare.
# routes = [
#   { pattern = "api.blackindenver.org", custom_domain = true }
# ]

[vars]
MARKET = "denver"
APP_BASE_URL = "https://blackindenver.org"
AUTH_BASE_URL = "https://api.blackindenver.org"
ALLOWED_ORIGINS = "https://blackindenver.org,https://www.blackindenver.org,https://blackindenver-fe.pages.dev,http://localhost:5173,http://localhost:4173"

# Secrets (never committed) — set with:
#   npx wrangler secret put DATABASE_URL --config wrangler-denver.toml
# DATABASE_URL          → the new Neon project's pooled connection string
# BETTER_AUTH_SECRET    → required by the shared app bootstrap
# HANDOFF_SIGNING_SECRET→ required by the shared app bootstrap

# Denver starts on the 4-hourly intake + the daily chain. The 30-minute
# review cycle and the Monday digest stay Atlanta-only until Denver has
# users to serve them to.
[triggers]
crons = ["0 10 * * *", "0 2,6,14,18,22 * * *"]
